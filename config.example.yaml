# vpaste 配置文件
# 复制到 ~/.config/vpaste/config.yaml 并填入你的配置

# 存储服务商: "cos" (腾讯云) | "s3" (AWS/阿里云/火山云/百度云) | "minio" (MinIO/自建S3)
provider: "cos"

# 认证信息
secret_id: "your_access_key"
secret_key: "your_secret_key"
# token: ""  # 可选，临时凭证时使用

# 存储桶
bucket: "your-bucket-name"
region: "ap-shanghai"

# S3 兼容服务 Endpoint（provider 为 s3/minio 时必填）
# endpoint: "https://s3.amazonaws.com"                     # AWS S3
# endpoint: "https://oss-cn-shanghai.aliyuncs.com"         # 阿里云 OSS
# endpoint: "https://tos-s3-cn-beijing.ivolces.com"        # 火山云 TOS
# endpoint: "https://s3.bj.bcebos.com"                     # 百度云 BOS
# endpoint: "http://localhost:9000"                         # MinIO

# 路径样式（MinIO 需要开启，云厂商一般不需要）
# force_path_style: true

# CDN 域名（可选，留空则用默认域名）
cdn_domain: "cdn.your-domain.com"

# 上传路径前缀
upload_path: "vpaste/temp"

# 临时文件自动清理配置
# temp_retention_hours: 24  # 文件保留时间（小时），默认24小时
